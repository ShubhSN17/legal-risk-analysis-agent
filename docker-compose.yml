version: '3.8'

services:
  api-service:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  ui-service:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "8501:8501"
    environment:
      # Tell Streamlit to route traffic to the Docker container, not localhost
      - API_URL=http://api-service:8000/analyze
    depends_on:
      - api-service